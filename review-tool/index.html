<title>Film Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen edit suite. Player left, notes right, transport + timeline docked below.
   Single dark theme on purpose: a neutral, slightly cool grey so the pastel films are judged on true colour. */
:root {
  --bg: #16171c;        /* suite background */
  --panel: #1e2027;     /* panels */
  --raise: #272a33;     /* buttons, inputs */
  --line: #343845;      /* hairlines, ticks */
  --fg: #e9e8f0;        /* text */
  --muted: #9a9cab;     /* secondary text */
  --accent: #ff7f6e;    /* coral from the films: playhead, primary actions */
  --fix: #ff8f7f;       /* note kinds (semantic) */
  --idea: #c4b8ff;
  --keep: #7fd8ac;
  --beat: #ffd27a;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
#root { height: 100%; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  box-sizing: border-box;
}

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .02em; }
.rec { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(255,127,110,.18); }
.films { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.films button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
}
.films button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.films .count { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.films button.on .count { color: #c0392b; }
.films .count:empty { display: none; }

/* stage */
.stage { display: grid; grid-template-columns: auto minmax(300px, 440px); gap: 16px; min-height: 0; justify-content: center; }
.viewer { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 0; }
.screen {
  height: 100%; max-height: 100%; min-height: 0; aspect-ratio: 9 / 16; max-width: 100%;
  background: #000; border-radius: 10px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.45);
}
.screen video { width: 100%; height: 100%; display: block; object-fit: contain; }
.readout { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: center; }
.readout .time { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.readout .of { font-family: var(--font-mono); color: var(--muted); }
.readout .meta { color: var(--muted); font-size: 12px; }

/* notes */
.notes { display: flex; flex-direction: column; gap: 10px; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.at { color: var(--muted); font-size: 12px; }
.at strong { font-family: var(--font-mono); color: var(--fg); font-size: 13px; }
.at em { font-style: normal; font-family: var(--font-mono); }
.kinds { display: flex; gap: 4px; }
.kind { background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.kind.on.k-fix { color: var(--bg); background: var(--fix); border-color: var(--fix); }
.kind.on.k-idea { color: var(--bg); background: var(--idea); border-color: var(--idea); }
.kind.on.k-keep { color: var(--bg); background: var(--keep); border-color: var(--keep); }
textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  resize: vertical; min-height: 64px; line-height: 1.45;
}
textarea::placeholder { color: var(--muted); }
.composer-foot { display: flex; justify-content: space-between; align-items: center; }
.hint { color: var(--muted); font-size: 12px; }
.primary { background: var(--accent); color: #2a1210; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 800; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-weight: 600; }
.danger { background: transparent; border: 1px solid var(--fix); color: var(--fix); border-radius: 8px; padding: 6px 12px; font-weight: 700; }
.small { padding: 3px 9px; font-size: 12px; }

.list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.filters { display: flex; gap: 4px; }
.filters button { background: transparent; border: 0; border-radius: 6px; padding: 5px 9px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.filters button.on { background: var(--raise); color: var(--fg); }

.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.empty { color: var(--muted); line-height: 1.5; padding: 18px 6px; text-align: center; }
.note {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px;
  padding: 9px 10px 9px 12px; border-radius: 8px; background: var(--bg); border-left: 3px solid var(--line);
}
.note.k-fix { border-left-color: var(--fix); }
.note.k-idea { border-left-color: var(--idea); }
.note.k-keep { border-left-color: var(--keep); }
.note.active { box-shadow: 0 0 0 1px var(--accent); }
.note.done .body p { text-decoration: line-through; color: var(--muted); }
.stamp { grid-row: span 2; align-self: start; font-family: var(--font-mono); font-size: 12px; font-weight: 700; background: var(--raise); border: 0; border-radius: 6px; padding: 4px 7px; }
.stamp:hover { color: var(--accent); }
.body { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.body p { margin: 0; line-height: 1.45; overflow-wrap: anywhere; }
.pill { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; flex: none; }
.k-fix .pill { color: var(--fix); }
.k-idea .pill { color: var(--idea); }
.k-keep .pill { color: var(--keep); }
.actions { display: flex; gap: 6px; }
.status { margin: 0; font-size: 12px; color: var(--muted); }
.status.s-error, .status.s-slow { color: var(--beat); }

/* dock */
.dock { display: flex; flex-direction: column; gap: 8px; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.transport > button { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.transport .play { background: var(--fg); color: var(--bg); min-width: 52px; }
.transport .add { margin-left: auto; background: var(--accent); color: #2a1210; border: 0; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.rate { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.rate select { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

.timeline { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 10px 10px; }
.tl-labels { display: grid; grid-template-rows: 26px 28px 28px; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; align-items: center; }
.tl-body { position: relative; display: grid; grid-template-rows: 26px 28px 28px; cursor: ew-resize; touch-action: none; user-select: none; }
.tl-ruler, .tl-track { position: relative; border-bottom: 1px solid var(--line); }
.tl-track:last-of-type { border-bottom: 0; }
.tick { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--line); }
.tick.major { height: 12px; background: var(--muted); }
.tick-label { position: absolute; top: 0; transform: translateX(4px); font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.beat { position: absolute; top: 4px; display: flex; align-items: center; gap: 5px; transform: translateX(-5px); white-space: nowrap; pointer-events: none; }
.beat i { width: 10px; height: 10px; background: var(--beat); transform: rotate(45deg); border-radius: 2px; }
.beat b { font-size: 11px; color: var(--beat); font-weight: 700; }
.marker { position: absolute; top: 6px; width: 14px; height: 16px; transform: translateX(-7px); border: 0; padding: 0; border-radius: 4px 4px 7px 7px; cursor: pointer; }
.marker.k-fix { background: var(--fix); }
.marker.k-idea { background: var(--idea); }
.marker.k-keep { background: var(--keep); }
.marker.done { opacity: .35; }
.marker:hover { transform: translateX(-7px) scale(1.2); }
.tl-loop { position: absolute; top: 0; bottom: 0; background: rgba(255,127,110,.12); border-inline: 1px solid rgba(255,127,110,.6); pointer-events: none; }
.playhead { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); transform: translateX(-1px); pointer-events: none; }
.playhead span { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--bg); background: var(--accent); border-radius: 4px; padding: 0 4px; }
.keys { margin: 0; color: var(--muted); font-size: 12px; }
kbd { font-family: var(--font-mono); font-size: 11px; background: var(--raise); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; margin: 0 1px; }

.boot { height: 100%; display: grid; place-items: center; color: var(--muted); }

/* narrow screens: stack and let the page scroll */
@media (max-width: 860px) {
  html, body, #root { height: auto; }
  .app { height: auto; grid-template-rows: auto auto auto; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .screen { height: auto; width: min(100%, 360px); }
  .notes { max-height: none; }
  .list { max-height: 50vh; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="root"><div class="boot">Loading the live preview…</div></div>
<script src="app.js"></script>
