<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fantastic 3D</title>
<style>
  html, body { margin: 0; background: #000; }
  #c { display: block; width: 100vw; max-width: 540px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../node_modules/three/build/three.min.js"></script>
<script>
// "Fantastic" in 3D: 14.4 s vertical clip. render(t) draws video time t deterministically.
// Open in a browser to watch it live; render.js captures it frame by frame.
(() => {
const W = 1080, H = 1920, DUR = 14.4;
const T = {
  hookEnd: 0.67, freezeEnd: 1.0, rewindEnd: 1.5, closeStart: 4.5, fant: 4.55, wideStart: 6.25,
  hit: 6.5, land: 7.75, bump0: 8.5, bumpGap: 0.6, jay: 12.0, slap: 12.75, title: 13.4,
};
const BUMPS = [0, 1, 2, 3, 4].map(i => T.bump0 + i * T.bumpGap);
const ROAD_HALF = 5, LANE_X = -1.8, NPC_START_X = -5.1, NPC_STOP_X = -2.0, LAND_Z = 14;

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function hash(a, b) { let s = (a * 374761393 + b * 668265263) | 0; s = (s ^ (s >>> 13)) * 1274126177 | 0; return ((s ^ (s >>> 16)) >>> 0) / 4294967296; }
const hillH = z => 9 * Math.exp(-Math.pow((z + 95) / 22, 2));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const FONT = '"Inter Display", "DejaVu Sans", sans-serif';

// ---------- renderer / scene ----------
THREE.ColorManagement.legacyMode = false;   // treat hex colours as sRGB, so skin and paint keep their real tones
const out = document.getElementById('c');
const octx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights = false;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc8789a, 60, 420);
const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 1200);

function canvasTex(w, h, draw, repeat, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .75, metalness: 0, ...extra });
function mesh(geo, m, cast = true, receive = true) { const o = new THREE.Mesh(geo, m); o.castShadow = cast; o.receiveShadow = receive; return o; }
const glowTex = canvasTex(128, 128, (g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });
function glow(color, size, opacity = .9) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.set(size, size, 1); return s; }

// ---------- sky, sun, clouds, environment reflections ----------
const skyTex = canvasTex(16, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#0f0a2e'); gr.addColorStop(.28, '#2e1a5e'); gr.addColorStop(.4, '#7a2f86'); gr.addColorStop(.47, '#e05a7e'); gr.addColorStop(.505, '#ffa65a'); gr.addColorStop(.53, '#ffcf8a'); gr.addColorStop(1, '#ffcf8a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const sunTex = canvasTex(512, 512, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, w * .2, w / 2, w / 2, w / 2); r.addColorStop(0, 'rgba(255,240,180,1)'); r.addColorStop(.42, 'rgba(255,200,120,1)'); r.addColorStop(.5, 'rgba(255,150,110,.5)'); r.addColorStop(1, 'rgba(255,120,120,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
});
function buildSky(target) {
  const dome = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 32), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
  target.add(dome);
  const sun = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, fog: false, depthWrite: false }));
  sun.position.set(-30, 22, -520); target.add(sun);
  return dome;
}
buildSky(scene);
{
  const cloudTex = canvasTex(256, 128, (g, w, h) => { for (let i = 0; i < 26; i++) { const x = w * (.15 + hash(i, 31) * .7), y = h * (.4 + hash(i, 32) * .3), r = 18 + hash(i, 33) * 30; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,220,235,.85)'); gr.addColorStop(1, 'rgba(255,200,230,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); } });
  for (let i = 0; i < 14; i++) {
    const c = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: .75, fog: false, depthWrite: false, color: i % 3 ? 0xffc7dc : 0xffe0c0 }));
    c.scale.set(140 + hash(i, 34) * 120, 50 + hash(i, 35) * 30, 1);
    c.position.set(-260 + hash(i, 36) * 520, 55 + hash(i, 37) * 110, -480 + hash(i, 38) * 120); scene.add(c);
  }
}
// environment map from the sky, so paint and glass reflect the sunset
{
  const envScene = new THREE.Scene(); buildSky(envScene);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, .02).texture;
}

// lights
scene.add(new THREE.HemisphereLight(0xffc2e0, 0x5a3d68, 0.8));
const sunLight = new THREE.DirectionalLight(0xffc690, 2.0);
sunLight.position.set(-35, 32, -70); sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
Object.assign(sunLight.shadow.camera, { left: -40, right: 40, top: 45, bottom: -45, near: 1, far: 220 });
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = .02;
scene.add(sunLight); scene.add(sunLight.target); sunLight.target.position.set(0, 0, 5);

// ---------- ground, hill, road, sidewalks ----------
{
  const g = new THREE.PlaneGeometry(400, 520, 80, 260); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const z = p.getZ(i) - 120; p.setZ(i, z); p.setY(i, hillH(z) - .03); }
  g.computeVertexNormals();
  const grass = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#4f6a3a'; c.fillRect(0, 0, w, h); for (let i = 0; i < 2500; i++) { c.fillStyle = ['#5f7d44', '#435c30', '#6c8a4d', '#3a5029'][i % 4]; c.fillRect(hash(i, 2) * w, hash(i, 3) * h, 2, 3); } }, [90, 120]);
  scene.add(mesh(g, std(0xffffff, { map: grass, roughness: .95 }), false, true));

  const asphalt = canvasTex(512, 1024, (c, w, h) => {
    c.fillStyle = '#55505e'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const v = 70 + hash(i, 5) * 30 | 0; c.fillStyle = `rgb(${v},${v - 2},${v + 6})`; c.fillRect(hash(i, 6) * w, hash(i, 7) * h, 2, 2); }
    for (let i = 0; i < 6; i++) { c.fillStyle = 'rgba(20,18,26,.35)'; c.beginPath(); c.ellipse(hash(i, 8) * w, hash(i, 9) * h, 30 + hash(i, 10) * 50, 14 + hash(i, 11) * 20, hash(i, 12) * 3, 0, Math.PI * 2); c.fill(); }
    c.strokeStyle = 'rgba(15,14,20,.6)'; c.lineWidth = 2; for (let i = 0; i < 5; i++) { c.beginPath(); let x = hash(i, 13) * w, y = hash(i, 14) * h; c.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (hash(i, k + 20) - .5) * 40; y += 18; c.lineTo(x, y); } c.stroke(); }
    // markings: centre double yellow, white edge lines, lane dashes
    c.fillStyle = '#e8c84a'; c.fillRect(w / 2 - 9, 0, 6, h); c.fillRect(w / 2 + 3, 0, 6, h);
    c.fillStyle = '#e9e6ee'; c.fillRect(46, 0, 6, h); c.fillRect(w - 52, 0, 6, h);
  }, [1, 30]);
  const road = new THREE.PlaneGeometry(ROAD_HALF * 2, 300, 4, 300); road.rotateX(-Math.PI / 2);
  const rp = road.attributes.position; for (let i = 0; i < rp.count; i++) { const z = rp.getZ(i) - 90; rp.setZ(i, z); rp.setY(i, hillH(z) + .02); }
  road.computeVertexNormals();
  scene.add(mesh(road, std(0xffffff, { map: asphalt, roughness: .92 }), false, true));
  // crosswalk 12 m up the street (he's not using it)
  for (let k = 0; k < 9; k++) { const s = mesh(new THREE.PlaneGeometry(.55, 3.2), std(0xeeeeee, { roughness: .8 }), false, true); s.rotation.x = -Math.PI / 2; s.position.set(-4.2 + k * 1.05, .035, -12); scene.add(s); }
  // manholes
  for (const [x, z] of [[1.4, 6], [-2.6, -26], [2.2, 24]]) { const m = mesh(new THREE.CylinderGeometry(.42, .42, .02, 24), std(0x2a2a2e, { metalness: .6, roughness: .5 }), false, true); m.position.set(x, .035, z); scene.add(m); }

  const paving = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#c9bdb2'; c.fillRect(0, 0, w, h); for (let i = 0; i < 1500; i++) { const v = 180 + hash(i, 40) * 40 | 0; c.fillStyle = `rgb(${v},${v - 10},${v - 18})`; c.fillRect(hash(i, 41) * w, hash(i, 42) * h, 2, 2); } c.strokeStyle = '#9e9389'; c.lineWidth = 3; for (let x = 0; x <= w; x += 64) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); } for (let y = 0; y <= h; y += 64) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); } }, [3, 70]);
  for (const side of [-1, 1]) {
    const s = mesh(new THREE.BoxGeometry(3.4, .16, 140), std(0xffffff, { map: paving, roughness: .85 }), false, true); s.position.set(side * (ROAD_HALF + 1.7), .08, 0); scene.add(s);
    const curb = mesh(new THREE.BoxGeometry(.18, .18, 140), std(0xb8b0b0, { roughness: .7 }), false, true); curb.position.set(side * (ROAD_HALF + .05), .09, 0); scene.add(curb);
  }
}

// ---------- buildings ----------
const lightsTex = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (hash(x + 3, y + 5) > .55) { c.fillStyle = hash(x, y) > .5 ? '#ffd9a0' : '#ffeacc'; c.fillRect(14 + x * 62, 18 + y * 62, 34, 36); } }, [1, 1]);
const facadeTex = canvasTex(256, 256, (c, w, h) => {
  c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 600; i++) { c.fillStyle = `rgba(0,0,0,${.02 + hash(i, 50) * .04})`; c.fillRect(hash(i, 51) * w, hash(i, 52) * h, 3, 3); }
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const px = 14 + x * 62, py = 18 + y * 62;
    c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(px - 4, py - 4, 42, 46);              // frame shadow
    c.fillStyle = '#f2ece6'; c.fillRect(px - 3, py - 3, 40, 44);                     // frame
    const lit = hash(x + 3, y + 5) > .55;
    const gr = c.createLinearGradient(px, py, px + 34, py + 36); gr.addColorStop(0, lit ? '#ffe2b0' : '#5a6488'); gr.addColorStop(1, lit ? '#e8b878' : '#2c3150');
    c.fillStyle = gr; c.fillRect(px, py, 34, 36);
    c.fillStyle = '#e8e2dc'; c.fillRect(px + 16, py, 2, 36); c.fillRect(px, py + 17, 34, 2); // mullions
    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(px - 5, py + 40, 44, 5);             // sill
  }
}, [1, 1]);
const awningTex = (a, b) => canvasTex(64, 64, (c, w, h) => { for (let x = 0; x < w; x += 16) { c.fillStyle = (x / 16) % 2 ? a : b; c.fillRect(x, 0, 16, h); } }, [6, 1]);
const neonMats = [];
{
  const cols = [0xf4b6c2, 0xa6e3d8, 0xf6d3a6, 0xc9bcf2, 0xf3eba8, 0xb3d6f2, 0xe8e0d6, 0xf0c0a0];
  const signs = ['MOTEL', 'TACOS', 'PAWN', '24H', 'SURF', 'LIQUOR', 'NAILS', 'DINER', 'PIZZA', 'GYM'];
  const awnings = [['#e84a6f', '#fff'], ['#2c8f7a', '#fff'], ['#f2a33a', '#fff'], ['#3a5fcf', '#fff']];
  let i = 0;
  for (const side of [-1, 1]) {
    for (let z = -55; z < 45; i++) {
      const d = 8 + hash(i, 4) * 6, w = 8 + hash(i, 5) * 5, h = 9 + hash(i, 6) * 20, x0 = side * (ROAD_HALF + 3.6);
      const col = cols[i % cols.length], g = new THREE.Group();
      const ft = facadeTex.clone(); ft.needsUpdate = true; ft.repeat.set(Math.round(d / 2.6), Math.round((h - 4.2) / 3.2));
      const lt = lightsTex.clone(); lt.needsUpdate = true; lt.repeat.copy(ft.repeat);
      const facade = std(col, { map: ft, emissive: 0xffc890, emissiveMap: lt, emissiveIntensity: .55, roughness: .8 });
      const plain = std(col, { roughness: .85 });
      const upper = mesh(new THREE.BoxGeometry(w, h - 4.2, d), [side < 0 ? plain : facade, side < 0 ? facade : plain, plain, plain, facade, facade]);
      upper.position.set(x0 + side * w / 2, 4.2 + (h - 4.2) / 2, z + d / 2); g.add(upper);
      // ground floor: storefront glass, door, awning
      const base = mesh(new THREE.BoxGeometry(w, 4.2, d), std(new THREE.Color(col).multiplyScalar(.8), { roughness: .8 })); base.position.set(x0 + side * w / 2, 2.1, z + d / 2); g.add(base);
      const glass = mesh(new THREE.BoxGeometry(.1, 2.7, d - 1.6), std(0x1a2238, { metalness: .9, roughness: .08 })); glass.position.set(x0 - side * .02, 1.75, z + d / 2); g.add(glass);
      const shopLight = mesh(new THREE.BoxGeometry(.05, 2.5, d - 1.8), new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: .18 })); shopLight.position.set(x0 + side * .1, 1.75, z + d / 2); g.add(shopLight);
      const door = mesh(new THREE.BoxGeometry(.12, 2.4, 1.1), std(0x3a2a22, { roughness: .6 })); door.position.set(x0 - side * .03, 1.2, z + .9); g.add(door);
      const [ca, cb] = awnings[i % awnings.length];
      const aw = mesh(new THREE.BoxGeometry(1.6, .08, d - .6), std(0xffffff, { map: awningTex(ca, cb), roughness: .9 })); aw.position.set(x0 - side * .8, 3.5, z + d / 2); aw.rotation.z = side * .32; g.add(aw);
      const awEdge = mesh(new THREE.BoxGeometry(.04, .35, d - .6), std(ca)); awEdge.position.set(x0 - side * 1.55, 3.12, z + d / 2); g.add(awEdge);
      // cornice and roof details
      const cornice = mesh(new THREE.BoxGeometry(w + .5, .45, d + .5), std(new THREE.Color(col).multiplyScalar(.9))); cornice.position.set(x0 + side * w / 2, h + .2, z + d / 2); g.add(cornice);
      const band = mesh(new THREE.BoxGeometry(w + .3, .25, d + .3), std(0xf2ece6)); band.position.set(x0 + side * w / 2, 4.25, z + d / 2); g.add(band);
      for (let k = 0; k < 2; k++) { const ac = mesh(new THREE.BoxGeometry(1.2, .8, 1), std(0x9a9aa4, { metalness: .4, roughness: .5 })); ac.position.set(x0 + side * (w * .3 + k * 2), h + .85, z + 1.5 + k * 2.5); g.add(ac); }
      // balconies on some buildings
      if (hash(i, 8) > .45) for (let y = 7.4; y < h - 1.5; y += 3.2) {
        const slab = mesh(new THREE.BoxGeometry(1.1, .12, d * .55), std(0xf2ece6)); slab.position.set(x0 - side * .5, y, z + d / 2); g.add(slab);
        const rail = mesh(new THREE.BoxGeometry(.05, .9, d * .55), std(0x2a2a30, { metalness: .6, roughness: .4 })); rail.position.set(x0 - side * 1.03, y + .5, z + d / 2); g.add(rail);
      }
      // neon sign above the awning
      const label = signs[i % signs.length], neon = hash(i, 7) > .5 ? '#ff4fa3' : '#3fe6d2';
      const st = canvasTex(512, 128, (c, cw, ch) => { c.font = `900 84px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.shadowColor = neon; c.shadowBlur = 24; c.fillStyle = neon; c.fillText(label, cw / 2, ch / 2); c.shadowBlur = 0; c.fillStyle = '#fff'; c.globalAlpha = .6; c.fillText(label, cw / 2, ch / 2); });
      const sm = new THREE.MeshBasicMaterial({ map: st, transparent: true, depthWrite: false }); neonMats.push(sm);
      const sign = new THREE.Mesh(new THREE.PlaneGeometry(4, 1), sm); sign.position.set(x0 - side * .08, 4.9, z + d / 2); sign.rotation.y = -side * Math.PI / 2; g.add(sign);
      g.traverse(o => { if (o.isMesh) { o.castShadow = o !== shopLight && o.material !== sm; o.receiveShadow = true; } });
      scene.add(g);
      z += d + .3;
    }
  }
}

// ---------- street furniture ----------
function streetLight(x, z, side) {
  const g = new THREE.Group(), metal = std(0x2c2c34, { metalness: .7, roughness: .4 });
  const pole = mesh(new THREE.CylinderGeometry(.07, .11, 7, 10), metal); pole.position.y = 3.5; g.add(pole);
  const arm = mesh(new THREE.CylinderGeometry(.05, .05, 2.2, 8), metal); arm.rotation.z = Math.PI / 2; arm.position.set(-side * 1.05, 6.9, 0); g.add(arm);
  const head = mesh(new THREE.BoxGeometry(.8, .18, .4), metal); head.position.set(-side * 2.1, 6.85, 0); g.add(head);
  const bulb = new THREE.Mesh(new THREE.BoxGeometry(.6, .04, .3), new THREE.MeshBasicMaterial({ color: 0xffe2a8 })); bulb.position.set(-side * 2.1, 6.75, 0); g.add(bulb);
  const gl = glow(0xffd28a, 2.2, .55); gl.position.set(-side * 2.1, 6.6, 0); g.add(gl);
  g.position.set(x, 0, z); scene.add(g);
}
function hydrant(x, z) { const g = new THREE.Group(), red = std(0xc0262e, { roughness: .5 }); const b = mesh(new THREE.CylinderGeometry(.13, .15, .6, 12), red); b.position.y = .45; g.add(b); const t = mesh(new THREE.SphereGeometry(.13, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), red); t.position.y = .75; g.add(t); const n = mesh(new THREE.CylinderGeometry(.06, .06, .38, 8), red); n.rotation.z = Math.PI / 2; n.position.y = .55; g.add(n); g.position.set(x, .16, z); scene.add(g); }
function bin(x, z) { const b = mesh(new THREE.CylinderGeometry(.3, .26, .95, 14), std(0x2f5a3a, { roughness: .6 })); b.position.set(x, .16 + .48, z); scene.add(b); const l = mesh(new THREE.CylinderGeometry(.32, .32, .06, 14), std(0x23452c)); l.position.set(x, 1.12, z); scene.add(l); }
function bench(x, z, side) { const g = new THREE.Group(), wood = std(0x8a5a3a, { roughness: .8 }), metal = std(0x2c2c34, { metalness: .6, roughness: .4 }); const seat = mesh(new THREE.BoxGeometry(.45, .06, 1.8), wood); seat.position.y = .48; g.add(seat); const back = mesh(new THREE.BoxGeometry(.06, .45, 1.8), wood); back.position.set(side * .22, .78, 0); g.add(back); for (const dz of [-.8, .8]) { const leg = mesh(new THREE.BoxGeometry(.4, .46, .06), metal); leg.position.set(0, .23, dz); g.add(leg); } g.position.set(x, .16, z); scene.add(g); }
for (const side of [-1, 1]) for (let z = -48; z < 42; z += 13) streetLight(side * (ROAD_HALF + .5), z + (side > 0 ? 6 : 0), side);
hydrant(-5.6, 7); hydrant(5.6, -9); hydrant(5.6, 19);
bin(-5.6, -6); bin(5.7, 4); bin(-5.6, 22); bin(5.7, -22);
bench(-7.8, 10, -1); bench(7.8, -4, 1); bench(7.8, 26, 1);

// palms
function palm(x, z, h, lean) {
  const g = new THREE.Group();
  const curve = new THREE.QuadraticBezierCurve3(V3(0, 0, 0), V3(lean * .4, h * .55, 0), V3(lean, h, 0));
  const barkTex = canvasTex(64, 256, (c, w, hh) => { c.fillStyle = '#7d5a40'; c.fillRect(0, 0, w, hh); for (let y = 0; y < hh; y += 10) { c.fillStyle = '#5e4230'; c.fillRect(0, y, w, 3); } }, [1, 6]);
  g.add(mesh(new THREE.TubeGeometry(curve, 16, .2, 10, false), std(0xffffff, { map: barkTex, roughness: .9 })));
  const frond = std(0x2f8a52, { side: THREE.DoubleSide, roughness: .8 });
  for (let k = 0; k < 11; k++) {
    const shape = new THREE.Shape(); shape.moveTo(0, 0); shape.quadraticCurveTo(.45, 1.6, 0, 3.4); shape.quadraticCurveTo(-.45, 1.6, 0, 0);
    const leaf = mesh(new THREE.ShapeGeometry(shape, 8), frond);
    const pivot = new THREE.Group(); pivot.position.set(lean, h, 0); pivot.rotation.y = k * Math.PI * 2 / 11 + hash(k, h | 0);
    leaf.rotation.x = -(1.05 + hash(k, 60) * .5); pivot.add(leaf); g.add(pivot);
  }

function storyTime(t) {

const PINK_V = 30, CREST = -95, CREST_T = 3.4;

  return { y, pitch };
}

}

const shots = {
  wide:  { pos: V3(-.6, 1.75, 17), look: V3(-2.6, 2.4, -60), fov: 52 },
  close: { pos: V3(-1.05, 1.72, 1.85), look: V3(-2.0, 1.66, 0), fov: 38 },
  hit:   { pos: V3(2.6, 1.6, 24), look: V3(-2, 1.6, 0), fov: 52 },
  land:  { pos: V3(4.2, 1.6, 21), look: V3(-1.8, .4, 14), fov: 52 },

function setCam(pos, look, fov) { camera.position.copy(pos); camera.lookAt(look); camera.fov = fov; camera.updateProjectionMatrix(); }

  if (t < T.wideStart) { const s = shots.close, k = prog(t, T.closeStart, T.wideStart); setCam(s.pos.clone().lerp(V3(-1.35, 1.7, 1.2), k * .5), s.look, s.fov); return; }

}

// ---------- overlays ----------
function outlined(text, x, y, size, fill, weight = 900) {

  octx.lineJoin = 'round'; octx.lineWidth = size * .16; octx.strokeStyle = '#000'; octx.strokeText(text, x, y);
  octx.fillStyle = fill; octx.fillText(text, x, y);
}
const SUBS = [[T.fant, T.fant + 1.75, 'Oh... fantastic.'], [T.jay, T.jay + 1.0, '"Jaywalking."']];
function overlays(t) {
  // light film grain and vignette for a filmed look
  const vg = octx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)'); octx.fillStyle = vg; octx.fillRect(0, 0, W, H);
  if (t < 3.0) { octx.save(); octx.globalAlpha = t < 2.7 ? 1 : 1 - prog(t, 2.7, 3.0); outlined('GTA 6 pedestrians', W / 2, 250, 84, '#fff'); outlined('on release day:', W / 2, 345, 84, '#fff'); octx.restore(); }
  if (t >= T.hookEnd && t < T.hookEnd + .12) { octx.fillStyle = `rgba(255,255,255,${.6 * (1 - prog(t, T.hookEnd, T.hookEnd + .12))})`; octx.fillRect(0, 0, W, H); }
  if (t >= T.freezeEnd && t < T.rewindEnd + .25) {

    if (t < T.rewindEnd) { for (let y = 0; y < H; y += 6) { octx.fillStyle = 'rgba(0,0,0,.18)'; octx.fillRect(0, y, W, 3); } octx.fillStyle = 'rgba(255,255,255,.22)'; octx.fillRect(0, (t * 3000) % H, W, 40); }
    outlined('◀◀', W / 2, 820, 120, '#fff'); outlined('6 SECONDS EARLIER', W / 2, 960, 76, '#ffd23f'); octx.restore();
  }
  for (const [a, b, s] of SUBS) if (t >= a && t < b) outlined(s, W / 2, 1440, 72, '#fff');
  if (t >= T.title) {
    const k = prog(t, T.title, T.title + .25);
    octx.fillStyle = `rgba(20,8,40,${.72 * k})`; octx.fillRect(0, 0, W, H);
    const s = lerp(1.6, 1, ease(k));
    octx.save(); octx.globalAlpha = k; octx.translate(W / 2, 900); octx.scale(s, s); octx.rotate(-.06);
    outlined('LIFE AS A', 0, -120, 92, '#ffd23f');
    octx.shadowColor = '#ff4fa3'; octx.shadowBlur = 40; outlined('GTA 6 NPC', 0, 30, 170, '#ff4fa3'); octx.shadowBlur = 0; octx.restore();
  }
}

function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const S = storyTime(t);
  update(S, t);
  cameraFor(Math.min(t, T.title - 1e-6), S);
  renderer.render(scene, camera);
  octx.setTransform(1, 0, 0, 1, 0, 0);

}

window.__anim = { duration: DUR, fps: 30, render, ready: document.fonts.ready };
if (!location.search.includes('capture')) {
  const start = performance.now();
  const loop = now => { render(((now - start) / 1000) % DUR); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
})();
</script>
