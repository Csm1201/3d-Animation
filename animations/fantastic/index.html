<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fantastic</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; max-width: 540px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Fantastic": 13.4 s vertical clip. render(t) draws video time t deterministically.
// Open this file in a browser to watch it; render.js steps through it frame by frame.
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920, GROUND = 1300;
const DUR = 13.4;

// ---------- timeline (seconds of video time) ----------
const T = {
  hookEnd: 0.67, freezeEnd: 1.0, rewindEnd: 1.5,
  closeStart: 4.5, fant: 4.55, wideStart: 6.25, hit: 6.5, land: 7.75,
  bump0: 8.5, bumpGap: 0.6, stop: 11.85, jay: 12.0, slap: 12.75,
};
const BUMPS = [0, 1, 2, 3, 4].map(i => T.bump0 + i * T.bumpGap);

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function hash(a, b) { let s = (a * 374761393 + b * 668265263) | 0; s = (s ^ (s >>> 13)) * 1274126177 | 0; return ((s ^ (s >>> 16)) >>> 0) / 4294967296; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function limb(pts, color, w) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.stroke(); }

// Story time S: what moment of the story is on screen. The hook shows the launch,
// freezes, rewinds to the stroll, then the story plays in real time.
function storyTime(t) {
  if (t < T.hookEnd) return 7.05 + t * 0.6;
  if (t < T.freezeEnd) return 7.05 + T.hookEnd * 0.6;
  if (t < T.rewindEnd) { const top = 7.05 + T.hookEnd * 0.6; return lerp(top, 1.5, ease(prog(t, T.freezeEnd, T.rewindEnd))); }
  return t;
}

// Camera: world point (cx, cy) at screen centre, zoom z.
function camera(t) {
  const WIDE = { z: 1.15, cx: 560, cy: 1040 }, TILT = { z: 1, cx: 560, cy: 560 };
  if (t < T.freezeEnd) return TILT;
  if (t < T.rewindEnd) { const k = ease(prog(t, T.freezeEnd, T.rewindEnd)); return { z: lerp(1, WIDE.z, k), cx: 560, cy: lerp(TILT.cy, WIDE.cy, k) }; }
  if (t < T.closeStart) return WIDE;
  if (t < T.wideStart) { const k = prog(t, T.closeStart, T.wideStart); return { z: lerp(2.3, 2.6, k), cx: 560, cy: 1185 }; }
  if (t < T.land) {
    const up = ease(prog(t, T.hit, T.hit + 0.35)), down = ease(prog(t, T.land - 0.45, T.land));
    const k = up * (1 - down); return { z: lerp(WIDE.z, TILT.z, k), cx: 560, cy: lerp(WIDE.cy, TILT.cy, k) };
  }
  if (t < 8.4) return { z: 1.3, cx: 640, cy: 1160 };
  if (t < T.stop) return { z: 1.7, cx: 740, cy: 1220 };
  const k = prog(t, T.slap, DUR);
  return { z: lerp(1.75, 1.95, k), cx: 820, cy: 1215 };
}

// ---------- world: background ----------
const BUILDINGS = [];
{ let x = 600, i = 0; const cols = ['#ffb3c7', '#9ee8de', '#ffd6a5', '#c3b5ff', '#fff1a8'];
  while (x < 1500) { const w = 170 + hash(i, 1) * 120; BUILDINGS.push({ x, w, h: 230 + hash(i, 2) * 260, c: cols[i % cols.length], sign: ['MOTEL', 'TACOS', 'PAWN', '24H', 'SURF'][i % 5] }); x += w + 14; i++; } }
const hillY = x => 1180 - 360 * Math.exp(-Math.pow((x - 250) / 270, 2));

function drawSky() {
  const g = ctx.createLinearGradient(0, -900, 0, 1250);
  g.addColorStop(0, '#1b0b3a'); g.addColorStop(.45, '#5a1f7a'); g.addColorStop(.75, '#d2457e'); g.addColorStop(1, '#ffa24d');
  ctx.fillStyle = g; ctx.fillRect(-400, -1200, W + 800, 2500);
  // stars in the high sky
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 70; i++) ctx.fillRect(hash(i, 7) * W, -900 + hash(i, 8) * 900, 3, 3);
  // sun with retro bands
  const sx = 820, sy = 980;
  const sg = ctx.createLinearGradient(0, sy - 170, 0, sy + 170); sg.addColorStop(0, '#ffe66b'); sg.addColorStop(1, '#ff4f7a');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 170, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 7; i++) { ctx.fillStyle = '#e8577a'; ctx.fillRect(sx - 180, sy + 20 + i * 22, 360, 3 + i * 1.6); }
}
function drawHill(S) {
  // distant hill on the left, the road climbs over its crest
  ctx.fillStyle = '#4b2a6e';
  ctx.beginPath(); ctx.moveTo(-200, 1300);
  for (let x = -200; x <= 800; x += 10) ctx.lineTo(x, hillY(x));
  ctx.lineTo(800, 1300); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2d1a44'; ctx.lineWidth = 14;
  ctx.beginPath(); for (let x = -200; x <= 800; x += 10) ctx.lineTo(x, hillY(x) + 4); ctx.stroke();
  // a few tiny palms on the ridge
  for (const px of [-60, 90, 420]) { const py = hillY(px); ctx.strokeStyle = '#2d1a44'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 6, py - 50); ctx.stroke();
    for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + (k - 2) * .55; ctx.beginPath(); ctx.moveTo(px + 6, py - 50); ctx.lineTo(px + 6 + Math.cos(a) * 26, py - 50 + Math.sin(a) * 14 + 8); ctx.stroke(); } }
  // red/blue glow behind the crest before the chase appears
  const glow = prog(S, 1.8, 3.0) * (S < 4.8 ? 1 : 0);
  if (glow > 0) { const on = Math.floor(S * 6) % 2; ctx.save(); ctx.globalAlpha = glow * .55; const rg = ctx.createRadialGradient(130, 830, 10, 130, 830, 260); rg.addColorStop(0, on ? '#ff2a4a' : '#3a6bff'); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg; ctx.fillRect(-150, 560, 560, 540); ctx.restore(); }
  // the distant chase cresting the hill
  if (S > 2.9 && S < 4.9) {
    const pathAt = p => { const x = -180 + p * 1000; let y = hillY(x); if (x > 250 && x < 470) y -= 70 * Math.sin(Math.PI * (x - 250) / 220); const ang = Math.atan2(hillY(x + 5) - hillY(x - 5), 10); return { x, y, ang: x > 250 && x < 470 ? ang * .3 - .08 : ang }; };
    for (let j = 5; j >= 0; j--) {
      const p = (S - 3.0 - (j ? .2 + j * .16 : 0)) / 1.5; if (p < 0 || p > .66) continue;
      const q = pathAt(p);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.ang); ctx.scale(.36, .36);
      if (j === 0) { pinkCar(-165, 0, S); } else copCar(-165, 0, S);
      ctx.restore();
      if (j === 0) starsAbove(q.x, q.y - 70, .5, S);
    }
  }
}
function drawStreet() {
  for (const b of BUILDINGS) {
    const top = GROUND - 20 - b.h;
    ctx.fillStyle = b.c; ctx.fillRect(b.x, top, b.w, b.h);
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(b.x + b.w - 18, top, 18, b.h);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(b.x, top, b.w, 8);
    for (let wy = top + 40; wy < GROUND - 90; wy += 46) for (let wx = b.x + 20; wx < b.x + b.w - 40; wx += 40) {
      ctx.fillStyle = hash(wx | 0, wy | 0) > .55 ? '#ffe9a3' : '#5a4a7a'; ctx.fillRect(wx, wy, 22, 26);
    }
    ctx.save(); ctx.font = '900 30px "Inter Display", "DejaVu Sans", sans-serif'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4fa3'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff4fa3'; ctx.fillText(b.sign, b.x + b.w / 2, top + 34); ctx.restore();
  }
  // palms in front of the buildings
  for (const px of [520, 990]) palm(px, GROUND - 14, 300);
  // sidewalk edge, road, curb, sand
  ctx.fillStyle = '#d9c7b8'; ctx.fillRect(-400, GROUND - 20, W + 800, 20);
  ctx.fillStyle = '#3a3346'; ctx.fillRect(-400, GROUND, W + 800, 190);
  ctx.fillStyle = '#f6e27a'; for (let x = -400; x < W + 400; x += 150) ctx.fillRect(x, GROUND + 92, 80, 8);
  ctx.fillStyle = '#9b8aa8'; ctx.fillRect(-400, GROUND + 190, W + 800, 14);
  ctx.fillStyle = '#e9cf9c'; ctx.fillRect(-400, GROUND + 204, W + 800, 800);
  ctx.fillStyle = 'rgba(180,140,90,.35)';
  for (let i = 0; i < 60; i++) ctx.fillRect(hash(i, 3) * W, GROUND + 230 + hash(i, 4) * 380, 10, 4);
}
function palm(x, base, h) {
  ctx.strokeStyle = '#8a5a3c'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x + 20, base - h * .5, x + 34, base - h); ctx.stroke();
  ctx.strokeStyle = '#1f9e6b'; ctx.lineWidth = 12;
  const tx = x + 34, ty = base - h;
  for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * .5; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + Math.cos(a) * 70, ty + Math.sin(a) * 70 - 10, tx + Math.cos(a) * 105, ty + Math.sin(a) * 52 + 32); ctx.stroke(); }
}

// ---------- vehicles (drawn with the bottom of the wheels at y) ----------
function wheels(x, y) { for (const wx of [x + 64, x + 266]) { ctx.fillStyle = '#15121c'; ctx.beginPath(); ctx.arc(wx, y - 26, 27, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#c8c0d8'; ctx.beginPath(); ctx.arc(wx, y - 26, 11, 0, Math.PI * 2); ctx.fill(); } }
function pinkCar(x, y, S) {
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + 165, y, 170, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff3d9a';
  ctx.beginPath(); ctx.moveTo(x, y - 30); ctx.lineTo(x + 6, y - 76); ctx.lineTo(x + 110, y - 86); ctx.lineTo(x + 170, y - 128); ctx.lineTo(x + 236, y - 126); ctx.lineTo(x + 290, y - 84); ctx.lineTo(x + 330, y - 70); ctx.lineTo(x + 334, y - 30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 8, y - 66, 320, 8);             // racing stripe
  ctx.fillStyle = '#9fdcff'; ctx.beginPath(); ctx.moveTo(x + 178, y - 120); ctx.lineTo(x + 230, y - 118); ctx.lineTo(x + 272, y - 88); ctx.lineTo(x + 150, y - 88); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c21f72'; ctx.fillRect(x - 6, y - 104, 50, 10); ctx.fillRect(x + 8, y - 96, 8, 20); // spoiler
  ctx.fillStyle = '#fff6b0'; ctx.fillRect(x + 318, y - 64, 14, 12);
  ctx.save(); ctx.globalAlpha = .6; ctx.fillStyle = '#ff4fd8'; ctx.fillRect(x + 20, y - 12, 290, 6); ctx.restore(); // underglow
  wheels(x, y);
}
function copCar(x, y, S) {
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + 165, y, 170, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2f2f2'; rr(x + 80, y - 140, 170, 60, 18); ctx.fill();
  ctx.fillStyle = '#16161e'; rr(x, y - 92, 334, 64, 16); ctx.fill();
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(x + 96, y - 92, 140, 64);
  ctx.fillStyle = '#16161e'; ctx.font = '900 26px "Inter Display", "DejaVu Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('POLICE', x + 166, y - 50);
  ctx.fillStyle = '#9fdcff'; rr(x + 96, y - 132, 66, 42, 8); ctx.fill(); rr(x + 170, y - 132, 66, 42, 8); ctx.fill();
  const on = Math.floor(S * 8) % 2;
  ctx.save(); ctx.shadowBlur = 40;
  ctx.shadowColor = '#ff2040'; ctx.fillStyle = on ? '#ff2040' : '#6a1020'; ctx.fillRect(x + 118, y - 158, 44, 18);
  ctx.shadowColor = '#2a6bff'; ctx.fillStyle = on ? '#24305a' : '#2a6bff'; ctx.fillRect(x + 166, y - 158, 44, 18);
  ctx.restore();
  ctx.fillStyle = '#fff6b0'; ctx.fillRect(x + 320, y - 80, 14, 14);
  wheels(x, y);
}
function starsAbove(cx, cy, s, S) {
  for (let i = 0; i < 5; i++) {
    const x = cx + (i - 2) * 46 * s, y = cy + Math.sin(S * 6 + i) * 3 * s, r = 20 * s;
    ctx.save(); ctx.beginPath();
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    ctx.closePath(); ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 16 * s; ctx.fillStyle = '#ffd23f'; ctx.fill();
    ctx.lineWidth = 4 * s; ctx.strokeStyle = '#7a4b00'; ctx.stroke(); ctx.restore();
  }
}
function helicopter(x, y, s, S, target) {
  if (target) {
    const lg = ctx.createLinearGradient(0, y, 0, target.y);
    lg.addColorStop(0, 'rgba(255,255,220,.05)'); lg.addColorStop(1, 'rgba(255,255,220,.3)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(x - 10, y + 20); ctx.lineTo(x + 10, y + 20); ctx.lineTo(target.x + 130, target.y); ctx.lineTo(target.x - 130, target.y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,220,.22)'; ctx.beginPath(); ctx.ellipse(target.x, target.y, 130, 22, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#1d2433'; ctx.beginPath(); ctx.ellipse(0, 0, 80, 36, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-180, -10, 120, 14); ctx.fillRect(-190, -34, 14, 40);
  ctx.fillStyle = '#9fdcff'; ctx.beginPath(); ctx.ellipse(38, -6, 32, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#1d2433'; ctx.lineWidth = 8; const rl = 150 * Math.abs(Math.cos(S * 40));
  ctx.beginPath(); ctx.moveTo(-rl, -48); ctx.lineTo(rl, -48); ctx.stroke(); ctx.fillRect(-4, -48, 8, 14);
  ctx.fillRect(-50, 36, 100, 6);
  ctx.restore();
}

// ---------- people ----------
// Side-view person, feet at (0,0), about 190 px tall. o.front draws a face turned to camera.
function person(o) {
  const skin = o.skin || '#c98b5e', shirt = o.shirt || '#38b6ff', pants = o.pants || '#2c3e66', ph = o.phase || 0;
  const pose = o.pose || 'stand';
  const swing = pose === 'walk' ? Math.sin(ph) * .45 : pose === 'flail' ? Math.sin(ph) * .9 : 0;
  // legs
  limb([-4, -62, -4 + Math.sin(swing) * 60, -62 + Math.cos(swing) * 60], pants, 15);
  limb([4, -62, 4 + Math.sin(-swing) * 60, -62 + Math.cos(-swing) * 60], pants, 15);
  ctx.fillStyle = '#222'; ctx.fillRect(-4 + Math.sin(swing) * 60 - 6, -62 + Math.cos(swing) * 60 - 4, 22, 8); ctx.fillRect(4 + Math.sin(-swing) * 60 - 6, -62 + Math.cos(-swing) * 60 - 4, 22, 8);
  // back arm
  if (pose === 'flail') limb([0, -116, -30, -150, -22, -186], skin, 11);
  else limb([0, -116, -Math.sin(swing) * 48, -116 + Math.cos(swing) * 48], skin, 11);
  // torso: Hawaiian shirt
  ctx.fillStyle = shirt; rr(-24, -128, 48, 72, 14); ctx.fill();
  if (o.flowers) { ctx.fillStyle = '#ffe14d'; for (const [fx, fy] of [[-12, -112], [10, -96], [-6, -76], [12, -66]]) { ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill(); } }
  if (o.badge) { ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(10, -108, 6, 0, Math.PI * 2); ctx.fill(); }
  // front arm (+ coffee)
  let hand;
  if (pose === 'flail') { limb([0, -116, 30, -150, 22, -186], skin, 11); }
  else if (o.holdCup != null) { const lift = o.holdCup; hand = [20, lerp(-84, -132, lift)]; limb([0, -116, 22, lerp(-96, -112, lift), hand[0], hand[1]], skin, 11); }
  else if (o.slapArm != null) { const a = o.slapArm; limb([0, -116, 34, lerp(-150, -90, a), lerp(40, 60, a), lerp(-170, -60, a)], skin, 11); }
  else limb([0, -116, Math.sin(swing) * 48, -116 + Math.cos(swing) * 48], skin, 11);
  if (hand) coffee(hand[0] + 4, hand[1] - 4, 0);
  // head
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -150, 23, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = o.hair || '#2b1a12'; ctx.beginPath(); ctx.arc(-2, -156, 23, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  if (o.cap) { ctx.fillStyle = o.cap; ctx.beginPath(); ctx.arc(0, -158, 24, Math.PI, 0); ctx.fill(); ctx.fillRect(-4, -162, 38, 8); ctx.fillStyle = '#ffd23f'; ctx.fillRect(-6, -176, 8, 8); }
  if (o.front) {
    // facing camera: half-lidded, done with everything
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -150, 23, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = o.hair || '#2b1a12'; ctx.beginPath(); ctx.arc(0, -158, 23, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
    if (o.shades) { ctx.fillStyle = '#111'; rr(-18, -158, 15, 9, 3); ctx.fill(); rr(3, -158, 15, 9, 3); ctx.fill(); ctx.fillRect(-4, -156, 8, 3); }
    else { for (const ex of [-8, 8]) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, -153, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#1a1020'; ctx.beginPath(); ctx.arc(ex, -152, 2.4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = skin; ctx.fillRect(ex - 6, -159, 12, 5); } }
    ctx.strokeStyle = '#5a2a20'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-7, o.talk ? -138 : -137); ctx.lineTo(7, -137); ctx.stroke();
    if (o.talk) { ctx.fillStyle = '#5a1020'; ctx.beginPath(); ctx.ellipse(0, -137, 5, 3.5 * o.talk, 0, 0, Math.PI * 2); ctx.fill(); }
  } else {
    if (o.shades) { ctx.fillStyle = '#111'; ctx.fillRect(2, -158, 24, 8); }
    else { ctx.fillStyle = '#1a1020'; ctx.beginPath(); ctx.arc(11, -153, pose === 'flail' ? 4 : 3, 0, Math.PI * 2); ctx.fill(); }
    if (pose === 'flail') { ctx.fillStyle = '#5a1020'; ctx.beginPath(); ctx.ellipse(13, -138, 5, 3, 0, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.strokeStyle = '#5a2a20'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(6, -138); ctx.lineTo(17, -138); ctx.stroke(); }
  }
}
function coffee(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#f4efe6'; ctx.beginPath(); ctx.moveTo(-11, -18); ctx.lineTo(11, -18); ctx.lineTo(8, 16); ctx.lineTo(-8, 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7a4a2a'; ctx.fillRect(-10, -6, 20, 10);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-12, -22, 24, 5);
  ctx.strokeStyle = '#3fe6d2'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(3, -22); ctx.lineTo(8, -36); ctx.stroke();
  ctx.restore();
}
const NPC = { shirt: '#38b6ff', flowers: true, shades: true };
const COP = { shirt: '#22336b', pants: '#151b33', cap: '#151b33', badge: true, skin: '#8d5a3b', hair: '#1a1a1a' };

// ---------- scene state from story time ----------
function copX(i, S) {
  const B = BUMPS[i], x0 = 570, v = 650;
  if (i === 4 && S > B) { const a = 704, d = Math.min(S - B, v / a); return x0 + v * d - .5 * a * d * d; }
  return x0 + (S - B) * v;
}
function flatness(S) { let f = 1; for (const b of BUMPS) if (S > b + .05) f *= .8; return Math.max(f, .35); }

function drawWorld(S, t) {
  drawSky();
  drawHill(S);
  drawStreet();

  const npcX = S < 4.5 ? 380 + (S - 1.5) * 60 : 560;
  const launched = S >= T.hit, landed = S >= T.land;

  // helicopter (near) and its spotlight
  if (S >= 6.0) {
    const hx = 260 + (S - 6) * 70 + Math.sin(S * 1.3) * 20, hy = 260 + Math.sin(S * 2) * 10;
    let target = null;
    if (!launched) target = { x: npcX, y: GROUND };
    else if (landed) target = { x: 760, y: GROUND + 120 };
    helicopter(hx, hy, 1, S, target);
  }

  // NPC
  if (!launched) {
    const walking = S < 4.5;
    const front = S >= 4.85;
    const cupLift = walking ? (Math.sin(S * 1.7) > .7 ? 1 : 0) : 1 - prog(S, 5.0, 5.3);
    const talk = (t >= T.fant && t < T.fant + 1.63 && Math.floor(t * 12) % 2) ? 1 : (t >= T.fant && t < T.fant + 1.63 ? .5 : 0);
    ctx.save(); ctx.translate(npcX, GROUND - 20);
    person({ ...NPC, pose: walking ? 'walk' : 'stand', phase: S * 7, holdCup: cupLift, front, talk });
    ctx.restore();
  } else if (!landed) {
    const u = prog(S, T.hit, T.land);
    const x = 560 + u * 200, y = lerp(GROUND - 20, GROUND + 128, u) - 4 * u * (1 - u) * 1450;
    ctx.save(); ctx.translate(x, y - 95); ctx.rotate(u * Math.PI * 4); ctx.translate(0, 95);
    person({ ...NPC, pose: 'flail', phase: S * 22 });
    ctx.restore();
    // coffee and sunglasses flying separately
    coffee(560 + u * 420, GROUND - 160 - 4 * u * (1 - u) * 1250, u * 14);
    ctx.save(); ctx.translate(560 + u * 140, GROUND - 170 - 4 * u * (1 - u) * 1550); ctx.rotate(-u * 10); ctx.fillStyle = '#111'; ctx.fillRect(-16, -5, 13, 9); ctx.fillRect(3, -5, 13, 9); ctx.fillRect(-3, -3, 6, 3); ctx.restore();
  } else {
    // lying flat on the road, head to the left. Lifts his head before the cops arrive.
    const f = flatness(S);
    const lift = S < BUMPS[0] - .2 ? Math.sin(Math.PI * prog(S, 7.9, 8.3)) * .3 : 0;
    const squash = S < T.land + .12 ? lerp(.55, 1, prog(S, T.land, T.land + .12)) : 1;
    ctx.save(); ctx.translate(840, GROUND + 128); ctx.scale(1, f * squash); ctx.rotate(-Math.PI / 2 + lift);
    person({ ...NPC, pose: 'stand' });
    ctx.restore();
    if (S >= T.slap) { ctx.save(); ctx.translate(735, GROUND + 112); ctx.rotate(-.12); ctx.fillStyle = '#fffbe8'; ctx.fillRect(-52, -26, 104, 52); ctx.strokeStyle = '#999'; ctx.lineWidth = 2; ctx.strokeRect(-52, -26, 104, 52); ctx.fillStyle = '#c21f2a'; ctx.font = '900 16px "Inter Display", "DejaVu Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('CITATION', 0, -5); ctx.fillStyle = '#222'; ctx.fillText('JAYWALKING', 0, 15); ctx.restore(); }
    // splat burst on landing
    if (S < T.land + .3) { const k = prog(S, T.land, T.land + .3); ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; for (let i = 0; i < 8; i++) { const a = Math.PI + i * Math.PI / 7; ctx.beginPath(); ctx.moveTo(760 + Math.cos(a) * 60 * (1 + k), GROUND + 118 + Math.sin(a) * 30 * (1 + k)); ctx.lineTo(760 + Math.cos(a) * 110 * (1 + k), GROUND + 118 + Math.sin(a) * 60 * (1 + k)); ctx.stroke(); } ctx.restore(); }
    // coffee lands upright next to him
    coffee(1000, GROUND + 112, 0);
  }

  // the pink car (near)
  if (S >= T.wideStart - .1) {
    const px = 230 + (S - T.hit) * (S < T.hit ? 1500 : 700);
    if (px < W + 200) { pinkCar(px, GROUND + 140, S); starsAbove(px + 165, GROUND - 70, 1, S); }
  }
  // the five cop cars
  if (S >= 6.9) for (let i = 4; i >= 0; i--) {
    const x = copX(i, S); if (x < -420 || x > W + 400) continue;
    // bounce when a wheel rolls over him
    let bump = 0; for (const wx of [x + 64, x + 266]) if (S >= T.land && wx > 660 && wx < 850) bump = Math.max(bump, Math.sin(Math.PI * (wx - 660) / 190) * 26);
    copCar(x, GROUND + 140 - bump, S);
  }
  // the cop who writes the ticket
  if (S >= T.stop) {
    const cx = lerp(990, 880, prog(S, T.stop, T.stop + .35));
    const slap = S < T.slap ? 0 : 1 - prog(S, T.slap + .15, T.slap + .5) * 0;
    const arm = S < T.slap - .15 ? 0 : prog(S, T.slap - .15, T.slap);
    ctx.save(); ctx.translate(cx, GROUND + 120); ctx.scale(-1, 1);
    person({ ...COP, pose: S < T.stop + .35 ? 'walk' : 'stand', phase: S * 9, slapArm: arm });
    ctx.restore();
    void slap;
  }

  // police lights wash over everything during the chase
  if (S > 6.3 && S < T.stop + .8) { ctx.fillStyle = (Math.floor(S * 6) % 2) ? 'rgba(255,30,70,.10)' : 'rgba(40,90,255,.10)'; ctx.fillRect(-400, -1200, W + 800, 3600); }
}

// ---------- overlays (screen space) ----------
function outlined(text, x, y, size, fill, align = 'center') {
  ctx.font = `900 ${size}px "Inter Display", "DejaVu Sans", sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .16; ctx.strokeStyle = '#000'; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
const SUBS = [[T.fant, T.fant + 1.75, 'Oh... fantastic.'], ...BUMPS.map((b, i) => [b + .05, b + .62, i === 4 ? '...ow.' : 'Ow.']), [T.jay, T.jay + 1.0, '"Jaywalking."']];
function overlays(t) {
  if (t < 3.0) {
    const a = t < 2.7 ? 1 : 1 - prog(t, 2.7, 3.0);
    ctx.save(); ctx.globalAlpha = a;
    outlined('GTA 6 pedestrians', W / 2, 250, 84, '#ffffff');
    outlined('on release day:', W / 2, 345, 84, '#ffffff');
    ctx.restore();
  }
  if (t >= T.hookEnd && t < T.hookEnd + .12) { ctx.fillStyle = `rgba(255,255,255,${.6 * (1 - prog(t, T.hookEnd, T.hookEnd + .12))})`; ctx.fillRect(0, 0, W, H); }
  if (t >= T.freezeEnd && t < T.rewindEnd + .25) {
    const a = t < T.rewindEnd ? 1 : 1 - prog(t, T.rewindEnd, T.rewindEnd + .25);
    ctx.save(); ctx.globalAlpha = a;
    if (t < T.rewindEnd) { for (let y = 0; y < H; y += 6) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, y, W, 3); } const band = (t * 3000) % H; ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, band, W, 40); }
    outlined('◀◀', W / 2, 820, 120, '#ffffff');
    outlined('6 SECONDS EARLIER', W / 2, 960, 76, '#ffd23f');
    ctx.restore();
  }
  for (const [a, b, s] of SUBS) if (t >= a && t < b) outlined(s, W / 2, 1440, 72, '#ffffff');
}

function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const S = storyTime(t), cam = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.cx, -cam.cy);
  drawWorld(S, t);
  ctx.restore();
  overlays(t);
}

window.__anim = { duration: DUR, fps: 30, render, ready: document.fonts.ready };
// live preview loop when opened in a browser (render.js sets ?capture to disable it)
if (!location.search.includes('capture')) {
  let start = performance.now();
  const loop = now => { render(((now - start) / 1000) % DUR); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
})();
</script>
</body>
</html>
